name: Deploy documentation

on:
  push:
    branches:
      - main
  # Build on pull requests too, so the check that gates a PR is the same job
  # that will run on main. The previous split had a separate ci.yml running
  # `mkdocs build --strict` with `checkout` and `setup-python` and nothing
  # else, so a PR touching `configure-pages`, `upload-pages-artifact` or
  # `deploy-pages` got a green tick from a job that used none of them.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per-ref, not a single global `pages` group. Now that pull requests build
  # too, a shared group would let a PR's build cancel an in-flight deploy of
  # main. Only pushes to main reach the deploy job, and they all share
  # `pages-refs/heads/main`, so deploys stay serialised as before.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build documentation
        run: mkdocs build --strict --site-dir site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    # Build on every pull request, publish only from main. A PR gets the whole
    # build path exercised and touches nothing live.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
